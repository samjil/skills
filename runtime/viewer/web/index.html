<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>samjil 에이전트 통합 대시보드</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <header class="toolbar">
    <div class="header-top">
      <h1>samjil 에이전트 대시보드</h1>
      <nav class="view-tabs" role="tablist">
        <button class="tab-btn active" id="tab-btn-qa" data-tab="qa" role="tab" aria-selected="true">⚡ 위임 실행 기록 (Delegate QA)</button>
        <button class="tab-btn" id="tab-btn-handoff" data-tab="handoff" role="tab" aria-selected="false">🤝 에이전트 인수인계 (Handoff)</button>
      </nav>
      <div class="header-actions">
        <label class="auto-refresh"><input type="checkbox" id="autorefresh" checked> 자동 갱신</label>
        <button id="refresh" title="지금 새로고침">↻</button>
      </div>
    </div>

    <!-- QA 전용 컨트롤 -->
    <div class="controls tab-panel-controls" id="qa-controls">
      <div class="search-input-wrap">
        <span class="search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input id="search" type="search" placeholder="검색 (질문/답변/모델/세션/작업ID)...">
      </div>
      <select id="modelfilter"><option value="">모든 모델</option></select>
      <select id="sessionfilter"><option value="">모든 세션</option></select>
      <select id="statusfilter">
        <option value="">모든 상태</option>
        <option value="OK">성공만</option>
        <option value="ERROR">실패만</option>
      </select>
    </div>

    <!-- Handoff 전용 컨트롤 -->
    <div class="handoff-controls-wrap tab-panel-controls" id="handoff-controls" style="display: none;">
      <div class="project-tabs-bar">
        <div class="project-tabs-label">프로젝트:</div>
        <div class="project-tabs" id="handoff-project-tabs" role="tablist" aria-label="프로젝트 목록">
          <span class="empty-tabs-msg">프로젝트 불러오는 중...</span>
        </div>
      </div>
      <div class="controls handoff-filters">
        <div class="search-input-wrap">
          <span class="search-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input id="handoff-search" type="search" placeholder="메시지 검색 (번호/제목/내용)...">
        </div>
        <select id="handoff-dir-filter">
          <option value="">모든 방향</option>
          <option value="c2a">Claude → agy (c2a)</option>
          <option value="a2c">agy → Claude (a2c)</option>
        </select>
        <select id="handoff-status-filter">
          <option value="">모든 상태</option>
          <option value="보냄">보냄 (미착수)</option>
          <option value="읽음">읽음 (작업중)</option>
          <option value="처리됨">처리됨 (직접반영)</option>
          <option value="확인함">확인함 (검증완료)</option>
          <option value="보류">보류</option>
        </select>
      </div>
    </div>

    <div class="status-line">
      <span id="count">불러오는 중...</span>
      <span id="updated"></span>
    </div>
  </header>

  <main>
    <!-- QA 뷰 -->
    <section id="qa-view" class="tab-panel active">
      <div id="cards"><p class="empty">데이터를 불러오는 중입니다...</p></div>
      <div class="load-more-wrap">
        <button id="loadmore" hidden>더 보기</button>
      </div>
    </section>

    <!-- Handoff 뷰 -->
    <section id="handoff-view" class="tab-panel" style="display: none;">
      <!-- BRIEF.md 요약 아코디언 -->
      <details id="handoff-brief-card" class="brief-card" style="display: none;">
        <summary>
          <span class="brief-title">📋 프로젝트 맥락 (<span id="brief-project-name"></span>/BRIEF.md)</span>
          <span class="brief-toggle-tip">클릭하여 펼치기/접기</span>
        </summary>
        <div id="handoff-brief-content" class="brief-content markdown-body"></div>
      </details>

      <!-- Handoff 메시지 목록 -->
      <div id="handoff-cards">
        <p class="empty">프로젝트를 선택해 주세요.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>
      이 페이지는 <code>~/.samjil/</code> 내의 위임 실행 기록(Delegate QA) 및 협업 대화(Handoff)를 로컬 웹 서버(<code>serve-viewer.ps1</code>)를
      통해 fetch로 직접 읽어옵니다. <code>127.0.0.1</code> 전용이며 외부에는 노출되지 않습니다.
    </p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="app.js?v=11"></script>
</body>
</html>
